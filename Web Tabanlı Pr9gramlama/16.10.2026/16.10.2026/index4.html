<!DOCTYPE html>
<html>
<head>
    <style>
        h1 {
            color: blue;
            font-family: verdana;
            font-size: 300%;
            border: 5px solid red;
            border-radius: 15px;
            text-align: center;
            margin: auto;
            padding: 10px;
        }

        p {
              color: red;
              font-family: courier;
              font-size: 160%;
              border:5px solid blue;
              border-radius:15px;
              text-align:center;
              margin:auto;
              padding:10px;
        }
    </style>
</head>
<body>

    <h1>This is a heading</h1>
    <p>This is a paragraph.</p>

</body>
</html>
